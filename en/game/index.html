<title>Free French game for kids 3-7, no ads: Capi's Tour of France</title><meta name="description" content="A free learning game with no ads and no sign-up for ages 3-7: puzzles, counting, memory and 14 French words spoken by French voices, in 14 towns of France."><link rel="canonical" href="https://nailrs.github.io/capi-la-tortue/en/game/"><link rel="alternate" hreflang="fr" href="https://nailrs.github.io/capi-la-tortue/jeu/"><link rel="alternate" hreflang="en" href="https://nailrs.github.io/capi-la-tortue/en/game/"><link rel="alternate" hreflang="x-default" href="https://nailrs.github.io/capi-la-tortue/jeu/"><meta property="og:title" content="Free French game for kids 3-7, no ads: Capi&#x27;s Tour of France"><meta property="og:description" content="A free learning game with no ads and no sign-up for ages 3-7: puzzles, counting, memory and 14 French words spoken by French voices, in 14 towns of France."><meta property="og:image" content="https://nailrs.github.io/capi-la-tortue/img/en/og.jpg"><link rel="icon" href="../../img/favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../../img/icon-192.png"><meta name="theme-color" content="#8fd8ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:Fredoka,'Trebuchet MS',system-ui,sans-serif;color:#2b2a4c;background:#8fd3f4}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;background:linear-gradient(#aee4ff,#e8f8ff 60%,#fff7df);overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:14px 14px 18px}
.scr.on{display:flex}
h1{font-size:clamp(30px,9vw,46px);margin:6px 0 0;text-align:center;line-height:1.05;color:#1f8a5b;text-shadow:0 3px 0 #fff}
h2{font-size:clamp(20px,6vw,28px);margin:4px 0 8px;text-align:center;line-height:1.15}
.sub{font-size:clamp(18px,5.4vw,24px);color:#e4572e;font-weight:700;text-align:center}
.btn{font:inherit;font-weight:700;font-size:clamp(22px,6.5vw,30px);border:0;border-radius:999px;padding:14px 34px;color:#fff;background:#ff8a3d;box-shadow:0 6px 0 #c95f1c;cursor:pointer;min-height:60px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c95f1c}
.btn.g{background:#2fb47c;box-shadow:0 6px 0 #1c8257}.btn.g:active{box-shadow:0 2px 0 #1c8257}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px}
.chip{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:999px;background:#fff;color:#2b2a4c;min-width:48px;height:48px;padding:0 14px;box-shadow:0 3px 0 #b9d7e6;cursor:pointer}
svg.i{display:block;width:100%;height:100%;overflow:visible}
.float{animation:fl 3.2s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-12px)}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{0%{transform:scale(.2);opacity:0}}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#hero{position:relative;flex:1;width:100%;min-height:0}
#hero .b{position:absolute;left:50%;top:2%;height:70%;aspect-ratio:200/260;transform:translateX(-50%)}
#hero .b.float{animation-name:flb}@keyframes flb{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-12px)}}
#hero .c{position:absolute;left:6%;bottom:0;width:40%;max-height:46%;aspect-ratio:1}
#hero .p{position:absolute;right:6%;bottom:2%;width:36%;max-height:42%;aspect-ratio:1}
#mapwrap{flex:1;width:100%;min-height:0;display:flex;justify-content:center}
#map{height:100%;max-width:100%}
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0;min-height:30px;flex-wrap:wrap}
.dots i{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #b9d7e6;display:block}
.dots i.f{background:#ffd23f;border-color:#e0a800}
#area{position:relative;flex:1;width:100%;min-height:0;border-radius:22px;overflow:hidden;background:linear-gradient(#bfeaff,#eafaff);touch-action:none}
#area .bg{position:absolute;left:0;right:0;bottom:0;opacity:.55}
.it{position:absolute;left:0;top:0;width:64px;height:64px;will-change:transform}
#pl{position:absolute;left:0;top:0;width:120px;height:120px;will-change:transform}
.grid{flex:1;width:100%;min-height:0;display:grid;gap:10px;align-content:center}
.card{position:relative;border-radius:18px;background:#2fb47c;box-shadow:0 5px 0 #1c8257;aspect-ratio:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;font-weight:700}
.card.o{background:#fff;box-shadow:0 5px 0 #d6e6ee}.card svg{display:none;padding:6%}.card.o svg{display:block}.card.o span{display:none}
.card.ok{background:#fff7c2;box-shadow:0 5px 0 #e0c95a}
.big{width:min(52vw,230px);aspect-ratio:1;margin:0 auto}
.row{display:flex;gap:10px;width:100%;justify-content:center;margin-top:10px}
.opt{flex:1;max-width:170px;background:#fff;border-radius:18px;box-shadow:0 5px 0 #d6e6ee;padding:8px;cursor:pointer;aspect-ratio:1;display:flex;align-items:center}
.opt.sil svg{filter:brightness(0);opacity:.8}
.opt.w{aspect-ratio:4/3;padding:5px}.opt.good{background:#d9f7e6;box-shadow:0 5px 0 #2fb47c}
.pic{width:min(74vw,360px);aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:#cdefff;box-shadow:0 5px 0 #b9d7e6;margin:6px auto}
.word{font-size:clamp(30px,9vw,44px);font-weight:700;color:#e4572e;text-align:center;margin:4px 0}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;min-height:0}
#stampbox{position:relative;width:min(64vw,280px);aspect-ratio:1;margin:10px auto;border-radius:50%;border:8px solid #e4572e;background:#fff;padding:12%;transform:rotate(-8deg)}
#stampbox:after{content:"";position:absolute;inset:8px;border-radius:50%;border:3px dashed #e4572e}
#friends{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;margin:8px 0}
#friends div{aspect-ratio:1}
.cf{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:cf linear infinite}@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
.hand{position:absolute;left:50%;top:55%;font-size:64px;margin-left:-32px;pointer-events:none;z-index:5;animation:hd 1.3s ease-in-out infinite;filter:drop-shadow(0 4px 0 #fff)}.hand.lo{top:auto;bottom:2%}.chip{white-space:nowrap}.hand.sl{animation:hs 1.6s ease-in-out infinite}@keyframes hd{50%{transform:scale(.8) translateY(10px)}}@keyframes hs{0%,100%{transform:translateX(-90px)}50%{transform:translateX(90px)}}
#bPar{font:inherit;font-size:14px;border:0;background:#fff;border-radius:999px;padding:10px 16px;color:#4a5b6b;min-height:44px;position:relative;overflow:hidden}#bPar i{position:absolute;left:0;top:0;bottom:0;width:0;background:#bfe9d3}#bPar.h i{width:100%;transition:width 1.5s linear}#bPar span{position:relative}
.pz{display:grid;gap:4px;width:min(90vw,440px);aspect-ratio:4/3;margin:0 auto;background:#3a2f4a;border:4px solid #3a2f4a;border-radius:14px;overflow:hidden}
.pc{position:relative;overflow:hidden;background:#cdefff;cursor:pointer}.pc>div{position:absolute}.pc.s{outline:6px solid #ff8a3d;outline-offset:-6px;filter:brightness(1.12)}
.mini{width:120px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;margin:0 auto 12px;border:3px solid #fff;box-shadow:0 3px 0 #b9d7e6}
.cntbox{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;background:#fff;border-radius:22px;padding:12px;margin:0 auto;max-width:400px}.cntbox div{width:72px;height:72px}
.opt.num{font-size:64px;font-weight:700;justify-content:center;color:#2b2a4c}
#alb{flex:1;width:100%;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px;align-content:start}
.stk{aspect-ratio:1;border-radius:50%;border:5px solid #e4572e;background:#fff;padding:14%;position:relative;cursor:pointer}.stk:after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px dashed #e4572e}
.stk.no{border-color:#c9d6de;cursor:default}.stk.no:after{border-color:#c9d6de}.stk.no svg{filter:brightness(0);opacity:.18}
.wtr{font-size:clamp(15px,4.2vw,19px);font-weight:600;color:#4a5b6b}.par{font-size:14px;text-align:center;margin-top:10px;color:#4a5b6b}.par a{color:#1f6fb4;font-weight:700}
</style></head><body>

let ac=null;
function tone(f,d=.12,type='sine',when=0,v=.18){if(!st.snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();
 const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
 o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+.02)}catch(e){}}
const sfx={tap:()=>tone(520,.07,'triangle'),pop:()=>{tone(660,.08,'triangle');tone(990,.1,'triangle',.07)},bad:()=>tone(180,.2,'sawtooth',0,.08),
 good:()=>[523,659,784].forEach((f,i)=>tone(f,.14,'triangle',i*.1)),win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.18,'triangle',i*.13))};
const vbuf={};let vsrc=null,vq=[],vdec=false,vtry=0;
function initAudio(){if(vdec)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();vdec=true;Object.keys(VOICE).forEach(k=>{const b=atob(VOICE[k]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
 try{ac.decodeAudioData(u.buffer,buf=>{vbuf[k]=buf},()=>{})}catch(e){}})}catch(e){}}
document.addEventListener('pointerdown',initAudio,true);
function vstop(){vq=[];if(vsrc){try{vsrc.onended=null;vsrc.stop()}catch(e){}vsrc=null}}
function voice(...n){if(!st.snd)return false;vstop();vq=n;vtry=0;nextV();return true}
function nextV(){if(!vq.length){vsrc=null;return}const n=vq[0],b=vbuf[n];if(!b||!ac){if(vtry++<14){setTimeout(nextV,150);return}vq.shift();vtry=0;nextV();return}
 vq.shift();vtry=0;try{if(ac.state=='suspended')ac.resume();const s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.onended=()=>{if(vsrc===s){vsrc=null;nextV()}};vsrc=s;s.start()}catch(e){vsrc=null}}
const vbusy=()=>!!vsrc||vq.length>0;

function playCity(i){const c=CITIES[i];show('playS');const kind=i%5;const after=()=>wordStep(i);
 [catchGame,memory,shadow,puzzle,countG][kind](i,after)}
function puzzle(i,done){const c=CITIES[i],cols=i<7?2:3,rows=2,n=cols*rows;$('pT').textContent=t('puz');dots(0,0);
 let ord=shuffle([...Array(n).keys()]);while(ord.every((v,k)=>v==k))shuffle(ord);let sel=-1,fin=false;
 function draw(){$('pBody').innerHTML=`<div class="mid"><div class="mini">${use('d_'+c.id)}</div><div class="pz" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">`+
  ord.map((p,k)=>`<div class="pc${k==sel?' s':''}" data-k="${k}" data-p="${p}"><div style="width:${cols*100}%;height:${rows*100}%;left:${-(p%cols)*100}%;top:${-(p/cols|0)*100}%">${use('d_'+c.id)}</div></div>`).join('')+'</div></div>';
  $('pBody').querySelectorAll('.pc').forEach(el=>el.onclick=()=>{if(fin)return;const k=+el.dataset.k;if(sel<0){sel=k;sfx.tap();draw()}else{if(sel!=k){[ord[sel],ord[k]]=[ord[k],ord[sel]];sfx.pop()}sel=-1;draw();
   if(ord.every((v,j)=>v==j)){fin=true;sfx.good();setTimeout(done,900)}}})}
 draw();hint(false,true)}
function countG(i,done){const max=i<7?5:8;let r=0,prev=0;const kinds=['croissant','crepe','star'];$('pT').textContent=t('cnt');
 function round(){dots(2,r);let n;do{n=1+(Math.random()*max|0)}while(n==prev);prev=n;const kd=kinds[Math.random()*3|0];
  let o=new Set([n]);while(o.size<3)o.add(Math.max(1,Math.min(9,n+((Math.random()*5|0)-2))));const opts=shuffle([...o]);
  $('pBody').innerHTML=`<div class="mid"><div class="cntbox pop">`+Array.from({length:n},()=>`<div>${use(kd)}</div>`).join('')+`</div><div class="row" style="margin-top:22px">`+opts.map(v=>`<div class="opt num" data-ok="${v==n?1:0}">${v}</div>`).join('')+'</div></div>';
  $('pBody').querySelectorAll('.opt').forEach(el=>el.onclick=()=>{if(el.dataset.ok=='1'){el.classList.add('good');sfx.pop();r++;dots(2,r);setTimeout(()=>{if(r>=2){sfx.good();done()}else round()},700)}
   else{sfx.bad();voice('c_retry');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}})}
 round();hint(false,true)}
function album(){texts();$('albName').textContent='';$('alb').innerHTML=CITIES.map((c,i)=>`<div class="stk${i<st.done?'':' no'}" data-i="${i}">${use(c.g)}</div>`).join('');
 $('alb').querySelectorAll('.stk').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(i>=st.done){sfx.bad();return}const c=CITIES[i];el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');sfx.pop();
  $('albName').textContent=c.gn+' · '+cn(c)+' · '+wd(c);voice('w'+i)||say(wd(c))});show('albS')}
function catchGame(i,done){const c=CITIES[i],n=5+(i/3|0);let got=0;$('pT').textContent=t('catch',{n});dots(n,0);
 $('pBody').innerHTML=`<div id="area"><div class="bg">${use('d_'+c.id)}</div><div id="pl">${use('plumefly')}</div></div>`;
 const A=$('area'),pl=$('pl');let W=A.clientWidth,H=A.clientHeight,px=W/2,items=[],last=performance.now(),acc=0,run=true;const kinds=['croissant','crepe','star'];
 A.querySelector('.bg').style.height=(W*.75)+'px';
 const mv=e=>{const r=A.getBoundingClientRect();px=Math.max(50,Math.min(W-50,e.clientX-r.left))};A.onpointerdown=mv;A.onpointermove=mv;
 function loop(now){if(!run)return;const dt=Math.min(.05,(now-last)/1000);last=now;W=A.clientWidth;H=A.clientHeight;const py=H*.7;acc+=dt;
  if(acc>.85&&items.length<5){acc=0;const e=document.createElement('div');e.className='it';e.innerHTML=use(kinds[Math.random()*3|0]);A.appendChild(e);items.push({e,x:40+Math.random()*(W-80),y:-60,v:H/(3.4-Math.min(1.2,i*.08))})}
  pl.style.transform=`translate(${px-60}px,${py-60}px)`;
  items=items.filter(o=>{o.y+=o.v*dt;o.e.style.transform=`translate(${o.x-32}px,${o.y-32}px)`;
   if(Math.abs(o.x-px)<62&&Math.abs(o.y-py)<52){o.e.remove();got++;sfx.pop();if(!vbusy()&&got<n)voice(got%2?'p_miam':'p_encore');dots(n,got);if(got>=n){run=false;sfx.good();setTimeout(done,600)}return false}
   if(o.y>H+40){o.e.remove();return false}return true});
  requestAnimationFrame(loop)}
 requestAnimationFrame(loop);stopGame=()=>{run=false};voice('p_catch');hint(true)}
function memory(i,done){const c=CITIES[i],np=i<6?3:4;$('pT').textContent=t('mem');dots(np,0);
 let pool=shuffle(['capi','plume'].concat(CITIES.slice(0,i).map(x=>x.g))).slice(0,np-1);pool.push(c.g);
 const cards=shuffle(pool.concat(pool));$('pBody').innerHTML=`<div class="grid" style="grid-template-columns:repeat(${np==3?3:4},1fr);max-width:${np==3?420:520}px;margin:0 auto">`+cards.map((k,j)=>`<div class="card" data-k="${k}" data-j="${j}"><span>?</span>${use(k)}</div>`).join('')+'</div>';
 let open=[],lock=false,found=0;voice('c_pairs');hint(false);
 $('pBody').querySelectorAll('.card').forEach(el=>el.onclick=()=>{if(lock||el.classList.contains('o'))return;el.classList.add('o');sfx.tap();open.push(el);
  if(open.length==2){const[a,b]=open;open=[];if(a.dataset.k==b.dataset.k){a.classList.add('ok');b.classList.add('ok');found++;dots(np,found);sfx.pop();if(found==np){sfx.good();setTimeout(done,800)}}
   else{lock=true;setTimeout(()=>{a.classList.remove('o');b.classList.remove('o');lock=false},800)}}})}
function shadow(i,done){const c=CITIES[i];let targets=[c.g].concat(shuffle(['capi','plume'].concat(CITIES.slice(0,i).map(x=>x.g))).slice(0,1)),r=0;
 const names={capi:'Capi',plume:'Plume'};CITIES.forEach(x=>names[x.g]=x.gn);
 function round(){const k=targets[r];$('pT').textContent=t('shad',{n:names[k]});dots(targets.length,r);
  const others=shuffle(Object.keys(names).filter(x=>x!=k)).slice(0,2),opts=shuffle([k].concat(others));
  $('pBody').innerHTML=`<div class="mid"><div class="big pop">${use(k)}</div><div class="row">`+opts.map(o=>`<div class="opt sil" data-k="${o}">${use(o)}</div>`).join('')+'</div></div>';
  $('pBody').querySelectorAll('.opt').forEach(el=>el.onclick=()=>{if(el.dataset.k==k){el.classList.remove('sil');el.classList.add('good');sfx.pop();r++;dots(targets.length,r);
    setTimeout(()=>{if(r>=targets.length){sfx.good();done()}else round()},800)}else{sfx.bad();voice('c_retry');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}})}
 round();voice('c_shadow');hint(false)}
function wordStep(i){const c=CITIES[i];$('pT').textContent=t('wordT');dots(2,0);const hello=t('hello',{n:c.gn,a:st.lang=='fr'?c.afr:c.aen,d:st.lang=='fr'?c.dfr:c.den});
 $('pBody').innerHTML=`<div class="mid"><div style="display:flex;align-items:center;gap:8px;justify-content:center"><div style="width:26%;max-width:120px;aspect-ratio:1" class="pop">${use(c.g)}</div><div style="font-size:clamp(16px,4.6vw,21px);font-weight:700;background:#fff;border-radius:16px;padding:10px 12px;max-width:62%">${hello}</div></div>
  <div class="pic">${use('d_'+c.id)}</div><div style="display:flex;align-items:center;justify-content:center;gap:10px"><div style="width:72px;height:72px;flex:none">${use('w_'+c.id)}</div><div><div class="word">${wd(c)}</div>${wtr(c)}</div></div><div class="row"><button class="chip" id="bSay" aria-label="${t('listen')}">🔊</button><button class="btn g" id="bNext">${t('next')}</button></div></div>`;
 $('bSay').onclick=()=>{voice('w'+i)||say(wd(c))};$('bNext').onclick=()=>{sfx.tap();quiz(i)};voice('c_word','w'+i)}
function quiz(i){const c=CITIES[i];$('pT').textContent=t('wordQ',{w:wd(c)});dots(2,1);voice('c_quiz','w'+i)||say(wd(c));
 const opts=shuffle([c].concat(shuffle(CITIES.filter(x=>x!=c)).slice(0,2)));
 $('pBody').innerHTML=`<div class="mid"><div style="display:flex;justify-content:center;align-items:end;gap:4%"><div style="width:30%;max-width:130px;aspect-ratio:1">${use('capi')}</div><div class="word" style="background:#fff;border-radius:18px;padding:8px 16px">${wd(c)} ?</div></div>
  <div class="row" style="margin-top:22px">`+opts.map(o=>`<div class="opt" data-k="${o.id}">${use('w_'+o.id)}</div>`).join('')+'</div></div>';
 $('pBody').querySelectorAll('.opt').forEach(el=>el.onclick=()=>{if(el.dataset.k==c.id){el.classList.add('good');dots(2,2);sfx.good();setTimeout(()=>stampStep(i),800)}else{sfx.bad();voice('c_retry');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}})}
function stampStep(i){const c=CITIES[i];try{window.goatcounter&&goatcounter.count({path:'jeu-en-ville-'+(i+1)+'-'+c.id,title:'Ville terminée',event:true})}catch(e){}if(i>=st.done){st.done=i+1;save()}$('pT').textContent=cn(c);dots(0,0);sfx.good();voice('c_bravo');
 $('pBody').innerHTML=`<div class="mid"><div class="word">${t('stamp',{n:i+1})}</div><div id="stampbox" class="pop">${use(c.g)}</div><div class="sub">${t('bravo')}</div><div class="row"><button class="btn" id="bN2">${t('next')}</button></div></div>`;
 $('bN2').onclick=()=>{sfx.tap();if(st.done>=14&&i==13)end();else{map();voice('p_route')}}}
function end(){try{window.goatcounter&&goatcounter.count({path:'jeu-en-tour-complet',title:'Tour complet',event:true})}catch(e){}texts();$('friends').innerHTML=CITIES.map(c=>`<div>${use(c.g)}</div>`).join('');show('endS');sfx.win();voice('p_youpi','c_devise');
 document.querySelectorAll('.cf').forEach(e=>e.remove());const cols=['#ff7b6b','#ffd23f','#5cc8e8','#2fb47c','#8e5bd6'];
 for(let k=0;k<26;k++){const e=document.createElement('div');e.className='cf';e.style.cssText=`left:${Math.random()*100}%;background:${cols[k%5]};animation-duration:${3+Math.random()*3}s;animation-delay:${-Math.random()*5}s`;$('endS').appendChild(e)}}
$('bPlay').onclick=()=>{sfx.tap();map();voice('c_welcome')};$('bHome').onclick=()=>{sfx.tap();home()};$('bQuit').onclick=()=>{sfx.tap();map()};$('bMap2').onclick=()=>{sfx.tap();map()};
$('cnt').onclick=()=>{sfx.tap();album()};$('bBack').onclick=()=>{sfx.tap();map()};
$('bGo').onclick=()=>{sfx.tap();playCity(sel)};
$('bLang').onclick=()=>{if(window.CAPI_ALT){location.href=window.CAPI_ALT;return}st.lang=st.lang=='fr'?'en':'fr';save();texts();sfx.tap()};$('bSnd').onclick=()=>{st.snd=!st.snd;save();texts();sfx.tap()};
let rs=0;$('bReset').onclick=()=>{if(++rs<2){$('bReset').textContent=t('reset')+' ?';return}rs=0;st.done=0;save();home()};
let pg=null;const gp=$('bPar');gp.onpointerdown=()=>{gp.classList.add('h');pg=setTimeout(()=>{gp.style.display='none';$('parL').style.display='block'},1500)};['pointerup','pointerleave','pointercancel'].forEach(e=>gp.addEventListener(e,()=>{clearTimeout(pg);gp.classList.remove('h')}));
home();
</script><script data-goatcounter="https://capilatortue.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
